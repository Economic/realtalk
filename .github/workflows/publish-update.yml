# "Publish update" (Phase 5 of plans/2026-10-23-implementation-data-update-workflows.md).
# A button for maintainers: after a maintainer has approved the draft PR, it
# merges the PR, runs the check on the merge commit, and tags it and creates the
# GitHub release. The release is what publishes: r-universe builds the latest
# release.
#
# Everything after the merge is in separate jobs, so "Re-run failed jobs"
# finishes a publish that failed partway. "Tag release" with the merge commit
# does too.
name: Publish update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the checks and show what would be published; merge and create nothing
        type: boolean
        default: false

permissions: {}

# Shared with "Tag release": one publish at a time
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      pr: ${{ steps.plan.outputs.pr }}
      head: ${{ steps.plan.outputs.head }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Real runs only from main
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish only from main. Use a dry run to test another branch."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history and tags, for the draft and version checks
          fetch-depth: 0
          persist-credentials: false

      - name: Check the draft
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: .github/scripts/publish-plan.sh

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.plan.outputs.pr }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          {
            echo "Dry run: every check passed. A real run would merge PR #$PR (${HEAD_SHA:0:7}) and release v$VERSION, with these notes:"
            echo
            # the same extraction tag-release.sh uses for the notes
            gh pr view "$PR" --json body --jq .body | sed -n '/^## Data update memo/,$p'
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the draft PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
        run: |
          # Pinned to the commit the plan job checked: GitHub refuses the merge
          # if the PR's head has changed since
          merge_sha=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" \
            -f merge_method=merge -f sha="$HEAD_SHA" --jq .sha)
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Merged PR #$PR as ${merge_sha:0:7}."
          # the full SHA, for "Tag release" if a later job fails
          echo "Merged PR #$PR as merge commit \`$merge_sha\`." >> "$GITHUB_STEP_SUMMARY"

          git fetch --quiet origin "$merge_sha"
          if [ "$(git rev-parse "$merge_sha^{tree}")" = "$(git rev-parse "$HEAD_SHA^{tree}")" ]; then
            echo "The merge commit's files match the checked draft." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The merge commit's files differ from the checked draft: something merged into main in the meantime. The check job runs on the merge commit."
          fi

          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/data-update" || true

  # A merge by the built-in token triggers no workflows, so the commit to
  # release is checked here
  check:
    needs: merge
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.merge.outputs.merge_sha }}

  tag:
    needs: [merge, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag and publish the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.merge.outputs.merge_sha }}
          DRY_RUN: "false"
        run: |
          git fetch --quiet origin "$TARGET"
          .github/scripts/tag-release.sh

  pkgdown:
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # A release created by the built-in token doesn't trigger
      # `release: published`, so the site is deployed from here
      - name: Deploy the site from the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh workflow run pkgdown.yaml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"

  r-universe:
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for r-universe to serve the new version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: .github/scripts/poll-r-universe.sh
